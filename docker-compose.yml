services:
  control-center:
    build: .
    container_name: 3d-printer-control-center
    # Host networking is REQUIRED: the headless-Chromium WebRTC relay must
    # advertise the Pi's real LAN IP as its ICE candidate so printers can send
    # media back. On a bridge network Chromium would offer a 172.x address that
    # the printers can't reach, and no video would ever arrive.
    network_mode: host
    # Run a tiny init as PID 1 so exited Chromium child processes get reaped
    # (Node as PID 1 leaves them as zombies).
    init: true
    restart: unless-stopped
    environment:
      - TZ=Asia/Colombo      # +05:30, same as the Pi
      - PORT=8081            # app binds :8081 directly on the host (no port mapping in host mode)
      # Refuse to start if this file is missing from /data (data drive not mounted).
      - DATA_MARKER=${DATA_MARKER:-}
      # Engine tuning (optional):
      # - AUTO_PAUSE_RUNOUT=1
      # - AUTO_PAUSE_ERROR=1
      # - STALL_MINUTES=8
      # - IDLE_OFF_MIN=10        # light + switchable fans off after this long idle (0 = never)
      # - DATASET_SNAPSHOT_SEC=20
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@local}
      # AI failure detection. Secrets live in ./.env (gitignored).
      # Stage 1: Obico failure detector on the Pi's NPU (the `detector` service; enabled when OBICO_TOKEN is set).
      - OBICO_URL=${OBICO_URL:-http://127.0.0.1:3333}
      - OBICO_TOKEN=${OBICO_TOKEN:-}
      - OBICO_IMAGE_BASE=${OBICO_IMAGE_BASE:-http://127.0.0.1:8081}
      - OBICO_SENSITIVITY=${OBICO_SENSITIVITY:-1}
      - AUTO_PAUSE_RISK=${AUTO_PAUSE_RISK:-0.5}   # pause when the detector's risk is above this (0 = never)
      - AUTO_PAUSE_JAM=${AUTO_PAUSE_JAM:-1}       # pause on a suspected jam / printing in air
      - PAUSE_REMIND_MIN=${PAUSE_REMIND_MIN:-5}   # remind every N min while an auto-paused print stays paused
      # Stage 2 (optional): vision LLM second opinion (enabled when AI_API_KEY is set).
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-http://10.0.68.30:8888}
    volumes:
      # On the Pi: DATA_PATH=/media/nvme/printer-control-center/data (in .env).
      - ${DATA_PATH:-./data}:/data
      - /etc/localtime:/etc/localtime:ro       # container clock/logs in the Pi's timezone

  # Obico failure detector on the Orange Pi's RK3566 NPU (see detector/). Optional:
  # start with `docker compose --profile npu up -d detector`, then point OBICO_URL at
  # http://127.0.0.1:3333. The model is converted with detector/convert.py.
  detector:
    build: ./detector
    image: obico-detector-npu:df8190e
    container_name: obico-detector
    profiles: [npu]
    network_mode: host            # listens on 127.0.0.1:3333 only (see Dockerfile CMD)
    restart: unless-stopped
    mem_limit: 1g
    devices:
      # The RK3566 NPU (RKNPU driver, DRM node pair).
      - /dev/dri/card1:/dev/dri/card1
      - /dev/dri/renderD129:/dev/dri/renderD129
    security_opt:
      # The RKNN runtime identifies the chip from /proc/device-tree/compatible, which
      # links into /sys/firmware: Docker masks that path by default. This unmasks it.
      - systempaths=unconfined
    environment:
      - ML_API_TOKEN=${OBICO_TOKEN}
      - TZ=Asia/Colombo
    volumes:
      - ${MODELS_PATH:-/media/nvme/printer-control-center/models}/obico-rk3566-fp16.rknn:/model_cache/ml_api/rknn/model-weights.rknn:ro
      - /etc/localtime:/etc/localtime:ro

  # Cloudflare Tunnel -> real HTTPS + remote access (required for Web Push).
  # 1) Create a tunnel in Cloudflare Zero Trust (Networks -> Tunnels).
  # 2) Add a Public Hostname mapping your subdomain -> http://localhost:8081
  # 3) Put the tunnel token in ./.env  (CLOUDFLARE_TUNNEL_TOKEN=...)
  cloudflared:
    image: cloudflare/cloudflared:2024.8.3
    container_name: cc-cloudflared
    network_mode: host    # reach control-center on localhost:8081
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - control-center
    profiles:
      - tunnel   # only starts when the 'tunnel' profile is enabled (token set)
