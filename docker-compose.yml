services:
  control-center:
    build: .
    container_name: 3d-printer-control-center
    ports:
      - "8081:8082"
    restart: unless-stopped
    environment:
      - TZ=UTC
      # Engine tuning (optional):
      # - AUTO_PAUSE_RUNOUT=1
      # - AUTO_PAUSE_ERROR=1
      # - STALL_MINUTES=8
      # - DATASET_SNAPSHOT_SEC=20
      # - VAPID_SUBJECT=mailto:you@example.com
    volumes:
      - ./data:/data
