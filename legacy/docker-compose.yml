services:
  control-center:
    build: .
    ports:
      - "8081:80"
    restart: unless-stopped
    container_name: 3d-printer-control-center
    environment:
      - TZ=UTC
    volumes:
      # Optional: Mount log directory for debugging
      - ./logs:/var/log/caddy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
